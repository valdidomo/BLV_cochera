# ====================================================================
# MACRO DE INICIO (START PRINT) - CONFIGURADA CON MALLA FIJA 'BLV'
# ====================================================================
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    # 1. Iniciar calentamiento base seguro
    M140 S{BED_TEMP}
    M104 S150             # Temperatura de espera para evitar goteo de filamento
    G90                   # Coordenadas absolutas
    CG28                  # Home inteligente
    
    # 2. Esperar temperatura de cama definitiva
    M118 Calentando cama a {BED_TEMP}°C...
    M190 S{BED_TEMP}
    
    # 3. Nivelación electrónica de motores Z (Z-Tilt)
    M118 Ajustando nivelación de husillos Z...
    Z_TILT_ADJUST
    G28 Z                 # Re-home del eje Z tras la nivelación de motores
    
    # 4. Carga de Malla de Nivelación Fija Guardada
    M118 Cargando malla de nivelación fija 'BLV'...
    BED_MESH_PROFILE LOAD=BLV  # Carga instantánea sin tocar la cama ni dar errores
    
    # 5. Calentamiento final del extrusor
    M118 Calentando extrusor a {EXTRUDER_TEMP}°C...
    G1 X155 Y155 Z10 F5000 # Posición de espera segura en el centro de la cama
    M109 S{EXTRUDER_TEMP}
    
    # 6. Purga clásica y efectiva para tu extrusor Sunrise
    M118 Ejecutando línea de purga tradicional...
    G1 X5 Y5 Z0.3 F5000    # Ir al inicio de la línea en la esquina delantera izquierda
    G92 E0                 # Resetear el extrusor
    G1 Y100 E15 F1500      # Imprimir una línea de purga de 100mm depositando filamento
    G92 E0                 # Resetear de nuevo el extrusor antes de iniciar la pieza
    M118 ¡Impresión iniciada!

# ====================================================================
# MACRO DE FIN (END PRINT) - OPTIMIZADA PARA BLV MGN CUBE (SENSORLESS)
# ====================================================================
[gcode_macro END_PRINT]
gcode:
    # 1. Retracción fuerte y elevación de seguridad
    G91                   # Coordenadas relativas
    G1 E-5 F2100          # Retracción de 5mm para limpiar la boquilla
    G1 Z5 F3000           # Baja la cama 5mm (aleja la pieza de la boquilla)
    G90                   # Coordenadas absolutas
    
    # 2. Desplazamiento controlado al frente izquierdo (X0 Y0)
    # Se usa F6000 (100mm/s) en lugar de F9000 para no forzar el Sensorless al parar
    G1 X0 Y0 F6000     
    
    # 3. Apagar componentes térmicos y ventiladores
    M104 S0               # Apagar extrusor
    M140 S0               # Apagar cama
    M106 S0               # Apagar ventilador de capa
    
    # 4. Gestión de motores (Crucial para Sensorless)
    M84                   # Apagar motores para liberar tensión y poder mover la cama
    M118 Impresión finalizada con éxito. Cabezal en X0 Y0.
