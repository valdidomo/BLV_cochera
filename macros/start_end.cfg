[gcode_macro START_PRINT]
gcode:
    # 1. Capturar los parámetros de temperatura desde el laminador
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    # 2. Configurar unidades y coordenadas absolutas
    G90 ; Coordenadas absolutas
    M83 ; Extrusor en modo relativo

    # 3. Calentamiento previo de la cama y boquilla "anti-goteo"
    M117 Calentando cama...
    M190 S{BED_TEMP} ; Esperar a que la cama llegue a su temperatura
    M104 S150 ; Precalentar boquilla a 150°C

    # 4. Homings y alineación electrónica
    M117 Haciendo Home...
    G28 ; Home de todos los ejes
    M117 Sincronizando Z...
    Z_TILT_ADJUST ; Alinea los dos motores independientes Z
    G28 Z ; Re-hacer home de Z

    # 5. Malla adaptativa con KAMP
    M117 Calculando Bed Mesh adaptativo...
    BED_MESH_CALIBRATE

    # 6. Calentamiento final de la boquilla (Calienta de forma segura)
    M117 Calentando boquilla...
    M109 S{EXTRUDER_TEMP} ; Esperar a que llegue a temperatura de impresión

    # 7. Línea de purga inteligente (KAMP)
    M117 Purgando con KAMP...
    LINE_PURGE
    M117 Imprimiendo...


[gcode_macro END_PRINT]
gcode:
    # 1. Asegurar coordenadas absolutas para los movimientos finales
    G90 ; Coordenadas absolutas
    M83 ; Extrusor en modo relativo

    # 2. Retracción de seguridad (evita hilos y goteos al enfriarse)
    G1 E-5 F1800 ; Retrae 5mm de filamento rápidamente

    # 3. Retirar la boquilla de la pieza impresa
    G91 ; Cambiar temporalmente a modo relativo
    G1 Z5 F3000 ; Levantar el eje Z unos 5mm para no rayar la pieza
    G90 ; Volver a modo absoluto

    # 4. Aparcar el carro en una zona cómoda (atrás a la izquierda)
    G1 X10 Y300 F5000 ; Mover el carro hacia atrás para liberar espacio

    # 5. Apagar todos los componentes por seguridad
    M104 S0 ; Apagar el fusor (extruder)
    M140 S0 ; Apagar la cama caliente (heated bed)
    M106 S0 ; Apagar el ventilador de capa (part cooling fan)
    M84 X Y E ; Desactivar motores X, Y y Extrusor

    # 6. Mensaje final en la interfaz
    M117 Impresión finalizada
