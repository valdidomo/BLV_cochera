[gcode_macro EJERCICIO_CORREAS]
description: Mueve el cabezal de forma intensa para asentar y ecualizar la tension de las correas
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28 ; Hace home si no lo ha hecho antes
    {% endif %}
    
    M117 Calentando motores y estirando correas...
    G90 ; Coordenadas absolutas
    
    ; Fase 1: Diagonales rápidas (Mueve un solo motor a la vez para estirar cada correa de forma independiente)
    G1 X10 Y10 F12000
    G1 X300 Y300 F18000
    G1 X10 Y300 F18000
    G1 X300 Y10 F18000
    G1 X10 Y10 F18000
    
    ; Fase 2: Cuadrado exterior perimetral
    G1 X300 Y10 F15000
    G1 X300 Y300 F15000
    G1 X10 Y300 F15000
    G1 X10 Y10 F15000
    
    ; Fase 3: Zig-zag intenso para asentar dientes
    G1 X50 Y50 F12000
    {% for i in range(5) %}
        G1 X250 Y50 F15000
        G1 X50 Y100 F15000
        G1 X250 Y150 F15000
        G1 X50 Y200 F15000
        G1 X250 Y250 F15000
        G1 X50 Y50 F15000
    {% endfor %}
    
    ; Volver al centro seguro
    G1 X155 Y155 Z20 F8000
    M117 Correas asentadas. ¡Lista para medir tension!
