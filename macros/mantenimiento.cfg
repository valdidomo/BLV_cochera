# ====================================================================
# 1. HOMING CONDICIONAL INTELIGENTE (ESTILO VORON)
# ====================================================================
[gcode_macro CG28]
description: Hace homing de los ejes únicamente si la impresora no está posicionada
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

# ====================================================================
# 2. MACRO: EJERCICIO DE ASENTAMIENTO DE CORREAS
# ====================================================================
[gcode_macro EJERCICIO_CORREAS]
description: Mueve el cabezal de forma segura leyendo los limites reales de la impresora
gcode:
    # Llamada a tu nuevo home inteligente
    CG28
    
    M117 Calculando zonas seguras...
    
    # Leer los límites reales de tu printer.cfg de forma dinámica
    {% set x_min = printer.toolhead.axis_minimum.x|float + 15.0 %}
    {% set x_max = printer.toolhead.axis_maximum.x|float - 15.0 %}
    {% set y_min = printer.toolhead.axis_minimum.y|float + 15.0 %}
    {% set y_max = printer.toolhead.axis_maximum.y|float - 15.0 %}
    {% set x_center = (x_min + x_max) / 2.0 %}
    {% set y_center = (y_min + y_max) / 2.0 %}
    
    G90 ; Coordenadas absolutas
    M117 Estirando correas...

    # Fase 1: Diagonales seguras por dentro de tus límites
    G1 X{x_min} Y{y_min} F10000
    G1 X{x_max} Y{y_max} F12000
    G1 X{x_min} Y{y_max} F12000
    G1 X{x_max} Y{y_min} F12000
    G1 X{x_min} Y{y_min} F12000
    
    # Fase 2: Cuadrado perimetral de seguridad
    G1 X{x_max} Y{y_min} F12000
    G1 X{x_max} Y{y_max} F12000
    G1 X{x_min} Y{y_max} F12000
    G1 X{x_min} Y{y_min} F12000
    
    # Fase 3: Zig-zag adaptado a tu BLV
    {% for i in range(3) %}
        G1 X{x_max} Y{y_min} F12000
        G1 X{x_min} Y{y_center} F12000
        G1 X{x_max} Y{y_max} F12000
        G1 X{x_min} Y{y_min} F12000
    {% endfor %}
    
    # Volver al centro real de tu electrónica
    G1 X{x_center} Y{y_center} Z20 F6000
    M117 Correas asentadas sin riesgo

# ====================================================================
# 3. MACROS: GESTIÓN DE FILAMENTO EN UN CLIC (MELLOW SUNRISE)
# ====================================================================
[gcode_macro DESCARGAR_FILAMENTO]
description: Calienta el extrusor y retrae el filamento automáticamente
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M118 Calentando a {TEMP}°C para descargar...
    M109 S{TEMP}
    G91
    G1 E2 F300             # Empuja un poco para cebar y evitar tapones
    G1 E-10 F3000          # Retirada rápida inicial
    G1 E-70 F1000          # Retirada lenta del resto del cuerpo
    G90
    M104 S0                # Apaga el fusor
    M118 Filamento descargado. ¡Ya puedes retirarlo!

[gcode_macro CARGAR_FILAMENTO]
description: Traga el filamento rápidamente y hace una pequeña purga de limpieza
gcode:
    {% set TEMP = params.TEMP|default(220)|float %}
    M118 Calentando a {TEMP}°C para cargar...
    M109 S{TEMP}
    G91
    G1 E60 F1000           # Carga rápida por el tubo de teflón
    G1 E20 F200            # Purga lenta para limpiar el color anterior
    G90
    M104 S0                # Apaga el fusor
    M118 Carga completada.


    # ====================================================================
# NIVELACIÓN MANUAL ASISTIDA (SCREWS TILT)
# ====================================================================

[screws_tilt_adjust]
# Coordenadas donde se posiciona el BLTOUCH (no la boquilla)
# Ajustadas para una BLV con tornillos aprox. a 30-40mm de los bordes
screw1: 40, 80          
screw1_name: frontal_izquierdo
screw2: 280, 80         
screw2_name: frontal_derecho
screw3: 280, 280        
screw3_name: trasero_derecho
screw4: 40, 280         
screw4_name: trasero_izquierdo
horizontal_move_z: 10.0
speed: 150
screw_thread: CW-M3     # Cambia a CW-M4 si tus tornillos son de 4mm
[gcode_macro NIVELAR_TORNILLOS]
description: Ejecuta el asistente de nivelacion de tornillos de la cama
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    SCREWS_TILT_CALCULATE

[gcode_macro TEST_VELOCIDAD_MAXIMA]
description: Test de velocidad extrema para comprobar perdida de pasos
gcode:
    # Parámetros configurables desde la consola
    {% set speed = params.SPEED|default(300)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set bound = params.BOUND|default(20)|int %}
    
    # Dimensiones de tu cama (BLV)
    {% set max_x = 270|int %}
    {% set max_y = 270|int %}
    
    # Calcular límites seguros de movimiento
    {% set x_min = bound %}
    {% set x_max = max_x - bound %}
    {% set y_min = bound %}
    {% set y_max = max_y - bound %}

    # Rutina inicial
    G28
    M118 Iniciando test a {speed} mm/s con {iterations} iteraciones...
    GET_POSITION ; Registra la posición inicial en la consola
    
    G90 ; Movimiento absoluto
    G0 X{x_min} Y{y_min} F{speed*60} ; Ir a esquina inicial

    # Bucle de movimientos extremos
    {% for i in range(iterations) %}
        # Cuadrante perimetral grande
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        
        # Diagonales cruzadas cruzando el centro
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
    {% endfor %}

    # Volver a casa y comprobar desalineación
    G28
    GET_POSITION ; Registra la posición final en la consola
    M118 Test finalizado. Compara en la consola si GET_POSITION coincide.

