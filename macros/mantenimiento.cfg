[gcode_macro EJERCICIO_CORREAS]
description: Mueve el cabezal de forma segura leyendo los limites reales de la impresora
gcode:
    # 1. Hacer home si es necesario
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    M117 Calculando zonas seguras...
    
    # 2. Leer los límites reales de tu printer.cfg de forma dinámica
    {% set x_min = printer.toolhead.axis_minimum.x|float + 15.0 %}
    {% set x_max = printer.toolhead.axis_maximum.x|float - 15.0 %}
    {% set y_min = printer.toolhead.axis_minimum.y|float + 15.0 %}
    {% set y_max = printer.toolhead.axis_maximum.y|float - 15.0 %}
    {% set x_center = (x_min + x_max) / 2.0 %}
    {% set y_center = (y_min + y_max) / 2.0 %}
    
    G90 ; Coordenadas absolutas
    M117 Estirando correas...

    # Fase 1: Diagonales seguras por dentro de tus límites
    G1 X{x_min} Y{y_min} F10000
    G1 X{x_max} Y{y_max} F12000
    G1 X{x_min} Y{y_max} F12000
    G1 X{x_max} Y{y_min} F12000
    G1 X{x_min} Y{y_min} F12000
    
    # Fase 2: Cuadrado perimetral de seguridad
    G1 X{x_max} Y{y_min} F12000
    G1 X{x_max} Y{y_max} F12000
    G1 X{x_min} Y{y_max} F12000
    G1 X{x_min} Y{y_min} F12000
    
    # Fase 3: Zig-zag adaptado a tu BLV
    {% for i in range(3) %}
        G1 X{x_max} Y{y_min} F12000
        G1 X{x_min} Y{y_center} F12000
        G1 X{x_max} Y{y_max} F12000
        G1 X{x_min} Y{y_min} F12000
    {% endfor %}
    
    # Volver al centro real de tu electrónica
    G1 X{x_center} Y{y_center} Z20 F6000
    M117 Correas asentadas sin riesgo
