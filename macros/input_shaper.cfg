[gcode_macro COMPROBAR_TENSION_CORREAS]
description: Mide la tensión de las correas CoreXY generando el gráfico comparativo
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 X155 Y155 Z30 F6000
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data HZ_PER_SEC=1
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data HZ_PER_SEC=1
    RUN_SHELL_COMMAND CMD=generate_belt_tension_graph
    RESPOND MSG="¡Prueba de correas finalizada! Procesando gráfico..."

[gcode_macro CALIBRAR_SHAPER_X]
description: Calibra únicamente el Eje X para no saturar la Raspberry Pi
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 X155 Y155 Z30 F6000
    SHAPER_CALIBRATE AXIS=X HZ_PER_SEC=0.5  # Bajamos a 0.5 para dar un respiro extra a la CPU
    RUN_SHELL_COMMAND CMD=generate_belt_tension_graph
    RESPOND MSG="Eje X calibrado. Gráfico generado."

[gcode_macro CALIBRAR_SHAPER_Y]
description: Calibra únicamente el Eje Y para no saturar la Raspberry Pi
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G1 X155 Y155 Z30 F6000
    SHAPER_CALIBRATE AXIS=Y HZ_PER_SEC=0.5  # Bajamos a 0.5 para dar un respiro extra a la CPU
    RUN_SHELL_COMMAND CMD=generate_belt_tension_graph
    RESPOND MSG="Eje Y calibrado. Gráfico generado. Escribe SAVE_CONFIG si terminaste ambos."
