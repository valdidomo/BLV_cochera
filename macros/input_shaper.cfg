# ====================================================================
# ENLACES CON EL SISTEMA OPERATIVO (G-CODE SHELL COMMANDS)
# ====================================================================

[gcode_shell_command limpiar_residuos_shaper]
command: bash /home/pi/printer_data/config/scripts/generar_graficas.sh clean
timeout: 10.0
verbose: True

[gcode_shell_command generate_belt_tension_graph]
command: bash /home/pi/printer_data/config/scripts/generar_graficas.sh belts
timeout: 60.0
verbose: True

[gcode_shell_command generate_shaper_graph_x]
command: bash /home/pi/printer_data/config/scripts/generar_graficas.sh shaper_x
timeout: 60.0
verbose: True

[gcode_shell_command generate_shaper_graph_y]
command: bash /home/pi/printer_data/config/scripts/generar_graficas.sh shaper_y
timeout: 60.0
verbose: True


# ====================================================================
# 1. MACRO: COMPROBAR TENSIÓN DE CORREAS
# ====================================================================
[gcode_macro COMPROBAR_TENSION_CORREAS]
description: Mide la tensión de las correas en diagonal y genera la gráfica comparativa
gcode:
    RUN_SHELL_COMMAND CMD=limpiar_residuos_shaper
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G1 Z20 F600
    G1 X155 Y155 F9000
    M118 Midiendo tensión física de Correas...
    TEST_RESONANCES AXIS=1,1
    TEST_RESONANCES AXIS=1,-1
    M118 Procesando gráfica de correas...
    RUN_SHELL_COMMAND CMD=generate_belt_tension_graph
    M118 Gráfica de correas guardada en la carpeta 'input_shaper'.

# ====================================================================
# 2. MACRO: INPUT SHAPER EJE X
# ====================================================================
[gcode_macro CALIBRAR_INPUT_SHAPER_X]
description: Calibración automática del Input Shaper para el Eje X y generación de gráfica
gcode:
    RUN_SHELL_COMMAND CMD=limpiar_residuos_shaper
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G1 Z20 F600
    G1 X155 Y155 F9000
    M118 Iniciando calibración Input Shaper Eje X...
    SHAPER_CALIBRATE AXIS=X
    M118 Procesando gráfica del Eje X...
    RUN_SHELL_COMMAND CMD=generate_shaper_graph_x
    M118 Test del Eje X terminado. Haz clic en 'SAVE_CONFIG' para guardar los datos.

# ====================================================================
# 3. MACRO: INPUT SHAPER EJE Y
# ====================================================================
[gcode_macro CALIBRAR_INPUT_SHAPER_Y]
description: Calibración automática del Input Shaper para el Eje Y y generación de gráfica
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G1 Z20 F600
    G1 X155 Y155 F9000
    M118 Iniciando calibración Input Shaper Eje Y...
    SHAPER_CALIBRATE AXIS=Y
    M118 Procesando gráfica del Eje Y...
    RUN_SHELL_COMMAND CMD=generate_shaper_graph_y
    M118 Test del Eje Y terminado. Haz clic en 'SAVE_CONFIG' para guardar los datos.
