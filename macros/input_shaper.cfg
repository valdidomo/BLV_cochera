[gcode_macro COMPROBAR_TENSION_CORREAS]
description: Realiza el test de resonancia físico en diagonal para evaluar las correas en CoreXY
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G1 Z20 F600
    G1 X155 Y155 F9000  # Se mueve al centro de la cama antes de medir
    M118 Iniciando prueba física de resonancia en ejes...
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data
    M118 ¡Prueba de correas finalizada! Procesando gráfico...
    RUN_SHELL_COMMAND CMD=generate_belt_tension_graph
