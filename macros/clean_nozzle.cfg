[gcode_macro CLEAN_NOZZLE]
variable_start_x: 325      # Coordenada fija en X
variable_start_y: 320      # Coordenada del fondo en Y
variable_start_z: 2.0      # <-- Recuerda ajustar este valor tras medirlo manualmente
variable_wipe_dist: -25    # Distancia en mm que avanza hacia el frente (en negativo)
variable_wipe_qty: 8       # Las 6 pasadas adelante/atrás
variable_wipe_spd: 5000    # Velocidad del raspado (mm/min)
variable_clear_z: 15       # Altura segura de viaje para moverse por encima de todo
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                # Hace home si no está hecho
    {% endif %}
    
    G90                    # Posicionamiento absoluto
    
    ## 1. Movimiento seguro hacia el cepillo
    G1 Z{clear_z} F1500               # Sube Z bien alto para evitar colisiones
    G1 X{start_x} Y{start_y} F6000     # Se mueve rápido a la esquina del cepillo
    G1 Z{start_z} F1500                # Baja a la altura exacta de raspado

    ## 2. Bucle de raspado (Solo eje Y, adelante y atrás)
    {% for i in range(1, wipe_qty + 1) %}
        G1 Y{start_y + wipe_dist} F{wipe_spd}  # Avanza hacia el frente
        G1 Y{start_y} F{wipe_spd}              # Vuelve al fondo
    {% endfor %}

    ## 3. Salida de seguridad
    G1 Z{clear_z} F1500                # Eleva el eje Z al terminar
