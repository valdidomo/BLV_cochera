# ====================================================================
# CONFIGURACIÓN UNIFICADA DE AUTOTUNE TMC (MOTORES 0.9°)
# ====================================================================

# --------------------------------------------------------------------
# 1. CONSTANTES DE MOTORES (Fichas Técnicas Oficiales Corregidas)
# --------------------------------------------------------------------

[motor_constants moons-ms17ha6p4200]
resistance: 6.90                 # <--- CORREGIDO: Valor real del motor de 0.9°
inductance: 0.0140               # <--- CORREGIDO: 14mH reales (antes 4mH, lo que provocaba la pérdida de pasos)
holding_torque: 0.44             # <--- Valor oficial de torque para la serie HA
max_current: 2.00
steps_per_revolution: 400

[motor_constants stepperonline-17hs19-2004s1]
resistance: 1.40
inductance: 0.0030
holding_torque: 0.59
max_current: 2.00
steps_per_revolution: 200

[motor_constants ldo-36sth20-1004ahg]
resistance: 2.10
inductance: 0.0016
holding_torque: 0.10
max_current: 1.00
steps_per_revolution: 200

# --------------------------------------------------------------------
# 2. ASIGNACIÓN DE AUTOTUNE A CADA EJE (CON SENSORLESS)
# --------------------------------------------------------------------

[autotune_tmc stepper_x]
motor: moons-ms17ha6p4200
tuning_goal: auto        # Cambiado de performance a auto
sg4_thrs: 120

[autotune_tmc stepper_y]
motor: moons-ms17ha6p4200
tuning_goal: auto        # Cambiado de performance a auto
sg4_thrs: 130

[autotune_tmc stepper_z]
motor: stepperonline-17hs19-2004s1
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: stepperonline-17hs19-2004s1
tuning_goal: silent

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: auto        # Cambiado de performance a auto
