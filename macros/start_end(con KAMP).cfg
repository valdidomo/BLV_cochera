# ====================================================================
# MACRO DE INICIO (START PRINT) - OPTIMIZADA CON KAMP ADAPTATIVO Y CEPILLO
# ====================================================================
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    # 1. Iniciar calentamiento base seguro
    M140 S{BED_TEMP}
    M104 S150             # Temperatura de espera para evitar goteo de filamento
    G90                   # Coordenadas absolutas
    CG28                  # Home inteligente
    
    # 2. Esperar temperatura de cama definitiva
    M118 Calentando cama a {BED_TEMP}°C...
    M190 S{BED_TEMP}
    
    # 3. Nivelación electrónica de motores Z (Z-Tilt)
    M118 Ajustando nivelación de husillos Z...
    Z_TILT_ADJUST
    G28 Z                 # Re-home del eje Z tras la nivelación de motores
    
    # 4. Malla Adaptativa Inteligente (KAMP)
    M118 Calculando malla adaptativa sobre la pieza...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE    # KAMP intercepta este comando y mide solo la zona de la pieza
    
    # 5. Calentamiento final del extrusor
    M118 Calentando extrusor a {EXTRUDER_TEMP}°C...
    G1 X5 Y5 Z10 F5000    # Posición de espera segura fuera de la cama
    M109 S{EXTRUDER_TEMP}
    
    # [OPTIMIZACIÓN] Retración de viaje para no dejar hilos en diagonal hacia el cepillo
    G92 E0
    G1 E-2 F2100           
    
    M118 Limpiando boquilla en el cepillo...
    CLEAN_NOZZLE           # Limpieza del extrusor justo antes de ir a imprimir
    
    # [OPTIMIZACIÓN] Recuperar el filamento retirado para alimentar la purga adaptativa
    G92 E0
    G1 E10 F1500           # Recupera los 8mm del END_PRINT anterior + los 2mm del viaje
    G92 E0                 
    
    # 6. Purga adaptativa de KAMP
    M118 Ejecutando purga inteligente de filamento...
    VORON_PURGE           # KAMP dibuja el pequeño logotipo de purga cerca de la pieza
    M118 ¡Impresión iniciada!

# ====================================================================
# MACRO DE FIN (END PRINT) - OPTIMIZADA PARA BLV MGN CUBE (SENSORLESS)
# ====================================================================
[gcode_macro END_PRINT]
gcode:
    # 1. Retracción fuerte y elevación de seguridad
    G91                   # Coordenadas relativas
    G1 E-3 F2100          # Primera retracción rápida al acabar la pieza
    G1 Z5 E-5 F3000       # Baja la cama 5mm mientras retira otros 5mm de filamento (Evita hilos y goteos)
    G90                   # Coordenadas absolutas
    
    # 2. Desplazamiento controlado al fondo (Libera la pieza hacia el frente)
    # He corregido la velocidad a F6000 para cuidar el sensorless y modificado X10 Y300
    G1 X10 Y300 F6000     
    
    # 3. Apagar componentes térmicos y ventiladores
    M104 S0               # Apagar extrusor
    M140 S0               # Apagar cama
    M106 S0               # Apagar ventilador de capa
    
    # 4. Gestión inteligente de motores (Mantiene Z-Tilt alineado)
    M84 E                 # Apaga SOLO el extrusor. X, Y y Z se quedan enganchados.
    M118 Impresión finalizada con éxito.
