[include mainsail.cfg]
# ====================================================================
# 1. ENLACES MODULARIZADOS Y SISTEMA
# ====================================================================
[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include macros/autotune_tmc.cfg]
[include macros/mantenimiento.cfg]
[include macros/input_shaper.cfg]
[include hardware/shell_command.cfg]
[include macros/clean_nozzle.cfg]



# Carpeta de macros modularizada
[include macros/start_end.cfg]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]

# ====================================================================
# telegram
# ====================================================================
[respond]

[gcode_arcs]
resolution: 0.1
# ====================================================================
# shaketune
# ====================================================================
[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
# ESTA ES LA OPCIÓN CORRECTA PARA QUE KLIPPER VEA LOS COMANDOS:
show_macros_in_webui: True






# ====================================================================
# CONFIGURACIÓN DEL ACELERÓMETRO (ADXL345 EN RPI) Y CORREAS
# ====================================================================
[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
rate: 1600
# Baja la velocidad a 1MHz para evitar errores por ruido con el movimiento
spi_speed: 2000000  



[resonance_tester]
accel_chip: adxl345
probe_points:
    155, 155, 20  # Centro exacto de tu cama BLV (310x310)



# ====================================================================
# CONFIGURACIÓN DE EJES (STEPPERS)
# ====================================================================

# Driver0 - Eje X
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 325
homing_speed: 40
homing_retract_dist: 0

# Driver1 - Eje Y
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -42
position_min: -42
position_max: 320
homing_speed: 40
homing_retract_dist: 0

# Driver2 - Eje Z principal
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 350
position_min: -6

# Driver3 - Segundo Eje Z
[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 8

# Driver4 - Extrusor (Mellow Sunrise)

[extruder]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 4.6095
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF4
control: pid
pid_kp: 23.569
pid_ki: 1.218
pid_kd: 114.016
min_temp: 1
max_temp: 300
min_extrude_temp: 180
max_extrude_only_distance: 200.0
max_extrude_only_velocity: 60
pressure_advance: 0.095
max_extrude_cross_section: 8.0



[verify_heater extruder]
max_error: 150         # Aumentamos el margen de error acumulado
check_gain_time: 40    # Damos 40 segundos para que el sistema se recupere del aire frío
heating_gain: 2        # Mantenemos que suba 2 grados en ese tiempo


# ====================================================================
# COMPONENTES TÉRMICOS Y VENTILACIÓN INTELIGENTE
# ====================================================================

[heater_bed]
heater_pin: PA1
sensor_pin: PF3 
sensor_type: ATC Semitec 104GT-2
control: pid
pid_kp: 75.549
pid_ki: 0.630
pid_kd: 2263.642
min_temp: 0
max_temp: 150

[verify_heater heater_bed]
max_error: 120
check_gain_time: 90    # Las camas con fuente propia calientan rápido, pero 90s es seguro
heating_gain: 1

[heater_fan hotend_fan]
pin: PD13
heater: extruder
heater_temp: 40.0
kick_start_time: 0.5
max_power: 1.0

[fan]
pin: PD14
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5


# Ventiladores configurados para activarse con el movimiento de los motores
[controller_fan ventilador_placa_1]
pin: PD15
max_power: 1.0
fan_speed: 1.0
idle_timeout: 60
idle_speed: 0.3          # <--- Mantiene el flujo de aire al 30% tras el reposo
stepper: stepper_x, stepper_y, stepper_z

[controller_fan ventilador_placa_2]
pin: PD12
max_power: 1.0
fan_speed: 1.0
idle_timeout: 60
idle_speed: 0.3          # <--- Protege los drivers del calor residual
stepper: stepper_x, stepper_y, stepper_z

# ====================================================================
# CONFIGURACIÓN CINEMÁTICA OPTIMIZADA
# ====================================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_330008000750534E4E313020-if00
restart_method: command
[printer]
kinematics: corexy
max_velocity: 300            
max_accel: 7400           
minimum_cruise_ratio: 0.5    
square_corner_velocity: 5.0
max_z_velocity: 15           
max_z_accel: 200



# ====================================================================
# CONFIGURACIÓN DRIVERS TMC2209 (RESTAURADOS Y SIN INTERPOLACIÓN XY)
# ====================================================================

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: PG6
run_current: 1.100       
interpolate: true   

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: PG9
run_current: 1.100   
interpolate: true      

[tmc2209 stepper_z]
uart_pin: PC6
diag_pin: PG10
run_current: 1.100       
interpolate: true

[tmc2209 stepper_z1]
uart_pin: PC7
diag_pin: PG11
run_current: 1.100        
interpolate: true

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.800        
interpolate: true

# ====================================================================
# input shaper
# ====================================================================
[input_shaper]
shaper_type_x: ei
shaper_freq_x: 80.6
shaper_type_y: mzv
shaper_freq_y: 47



# ====================================================================
# SENSADO, PINES Y NIVELACIÓN ELECTRÓNICA
# ====================================================================

[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7, EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13, EXP1_7=PE14, EXP1_8=PE15,
    EXP2_1=PA6, EXP2_2=PA5, EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7, EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

[bltouch]
sensor_pin: ^PB7
control_pin: PB6
x_offset: 0
y_offset: -40
#z_offset: 0
speed: 5                
lift_speed: 15          
samples: 3              
samples_result: median  
sample_retract_dist: 3  
samples_tolerance: 0.02
samples_tolerance_retries: 5


[safe_z_home]
home_xy_position: 155,155 
speed: 75
z_hop: 12                 
z_hop_speed: 60

[z_tilt]
z_positions:
    -30, 155           
    340, 155           
points:
    40, 155            
    270, 155           
speed: 150
horizontal_move_z: 8
retries: 10            
retry_tolerance: 0.02  

[bed_mesh]
speed: 200
horizontal_move_z: 5
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5       
algorithm: bicubic
mesh_min: 40, 40       
mesh_max: 270, 270     

# ====================================================================
# ADICIONALES: PANTALLA, MONITOREO Y BACKUPS
# ====================================================================

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[output_pin beeper]
pin: EXP1_1

[neopixel mks_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[gcode_shell_command backup_cfg_github]
command: sh /home/pi/printer_data/config/3dwork-autocommit.sh
timeout: 30.
verbose: True

[gcode_macro BACKUP_CFG_GITHUB]
gcode:
    RUN_SHELL_COMMAND CMD=backup_cfg_github
    
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

